spring.application.name=car-rental-backend
server.port=8080

# ---------- MySQL connection ----------
spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Kavana@2004

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- File upload (driving license images) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- JWT settings ----------
app.jwt.secret=CarRentalSecretKey2026_ForLearningOnly_ChangeThisToLongRandomText_0123456789
app.jwt.expiration-ms=86400000

# ---------- Default admin account (created on first start) ----------
app.admin.email=admin@carrental.com
app.admin.password=Admin@123

# ---------- Uploaded files (driving licenses) ----------
app.upload.dir=uploads